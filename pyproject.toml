[build-system]
requires = ["hatchling>=1.26,<1.32"]
build-backend = "hatchling.build"

[project]
name = "dmc-navigator"
version = "0.3.0"
description = "Thin remote client for DMC Navigator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "deepmedchem[auth]>=0.2.0b1,<0.3",
  "platformdirs>=4.2,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
navigator = "dmc_navigator.cli:app"

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8.2", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/dmc_navigator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
